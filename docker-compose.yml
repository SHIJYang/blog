# 本地开发依赖：PostgreSQL 17 + pgvector（与生产的 Supabase PG17 对齐）
# 用法：docker compose up -d
# 注意：这是**本地开发库**，不用于线上部署（本期不做部署，见 docs/upgrade-research-report.md D16）

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: blog-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      # 统一时区，避免 timestamptz 在容器与宿主之间来回换算
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
