# 项目名称，必须使用小写字母和下划线
name: addtoblog
# 项目描述文本
description: "addtoblog"

publish_to: 'none'
# 项目版本号，格式为 x.y.z
version: 1.0.0

environment:
  sdk: ^3.13.4

# 运行时依赖的包
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.6.0
  desktop_drop: ^0.8.4
  file_picker: ^13.1.0
  markdown_widget: ^2.3.2+8
  shared_preferences: ^2.5.6



# 开发时依赖的包（如测试工具）
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


# 需要打包的资源文件
assets:
  - images/
  - assets/data.json