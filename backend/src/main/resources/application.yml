spring:
  # 真实连接串与密钥放本地文件（已被 .gitignore 排除，不进仓库）
  # 从 backend/ 启动读 ./application-local.yml；从仓库根启动读 ./backend/application-local.yml
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./backend/application-local.yml
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800

mybatis-plus:
  type-handlers-package: com.blog.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.blog: debug

agnes:
  api:
    chat-url: https://api.agnes-ai.cn/v1/chat/completions
    embedding-url: https://api.siliconflow.cn/v1/embeddings
    embedding-model: BAAI/bge-m3
    chat-model: agnes-3-flash

picui:
  api-url: https://picui.cn/api/v1

memory:
  upload-dir: uploads/memory
  access-prefix: /uploads/memory
  image-quality: 0.85
  max-context-messages: 20
  recall-top-k: 3
  rate-limit-per-minute: 10
  auto-condense-idle-minutes: 2
  auto-condense-max-per-round: 5

embedding:
  dimension: 1024
  min-score: 0.35

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
