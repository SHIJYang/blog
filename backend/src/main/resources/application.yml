# 生产/测试数据库配置（不含真实密码，仅结构参考）
# 三个值全部来自环境变量，本地开发请用 application-local.yml 覆盖（见该模板）
# 显式留空而不是给 localhost 兜底：宁可启动即失败，也不允许生产误连到本地库
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    # 实体用 LocalDateTime，而列是 timestamptz：pgjdbc 发送时不带时区，
    # 由会话时区决定如何落库。Supabase 会话默认 UTC，JVM 默认 +8，
    # 不统一就会整体偏 8 小时（日记时间轴、create_time 排序全错）。
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
  # 把 backend/.env 当作 properties 读进来（不存在则跳过），这样文档里的 .env 做法在 Java 侧也成立
  config:
    import: optional:file:./.env[.properties]
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # V1 是全量基线；空库直接建，已有 flyway_schema_history 的库不会重复基线
    baseline-on-migrate: false
    validate-on-migrate: true

jwt:
  expiration: 604800

mybatis-plus:
  # 本包内的 TypeHandler 全局生效：目前只有 timestamptz ↔ LocalDateTime
  # （pgjdbc 不肯把 timestamptz 直接转 LocalDateTime，MyBatis 自带 handler 会抛异常）
  type-handlers-package: com.blog.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 分页统一走 MyBatis-Plus 的 PaginationInnerInterceptor，PageHelper 已移除，这里不留空配置块

# Agnes AI 配置（API Key 在后台管理系统配置，此处不硬编码）
agnes:
  api:
    chat-url: https://api.agnes-ai.cn/v1/chat/completions
    embedding-url: https://api.siliconflow.cn/v1/embeddings
    embedding-model: BAAI/bge-m3
    chat-model: agnes-2.5-flash

# 记忆照片存储配置
memory:
  upload-dir: uploads/memory
  access-prefix: /uploads/memory
  image-quality: 0.85
  max-context-messages: 20
  recall-top-k: 3
  rate-limit-per-minute: 10
  auto-condense-idle-minutes: 2
  auto-condense-max-per-round: 5

# 向量检索配置
embedding:
  dimension: 1024
  min-score: 0.35

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
